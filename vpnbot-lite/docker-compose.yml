services:
  vpnbot:
    build: .
    image: vpnbot-lite:local
    container_name: vpnbot-lite
    restart: unless-stopped
    # host network: no NAT overhead, real client IPs, ports are opened directly on the server
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/data
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:$${SUB_PORT:-2096}/health || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
